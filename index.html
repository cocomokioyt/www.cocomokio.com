<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CoCoMokio</title>
        <link rel="shortcut icon" href="Images/CMC logo.svg" type="image/svg+xml">
        <link rel="stylesheet" href="DarkStyles.css">
        <script src="scripts/site.js" defer></script>
        <script src="scripts/store/ranks.js" defer></script>
        <script src="scripts/store/items.js" defer></script>
        <script src="scripts/store-grid.js" defer></script>
        <script src="scripts/home.js" defer></script>
    </head>
    <body>
        <div data-shared-header data-title="Home" data-title-class="page-title" data-title-href="/" data-account-links></div>
        <section class="tile-stack">
            <a class="tile feature-tile store-feature-tile" href="https://store.cocomokio.com/">
                <div class="tile-image-grid store-tile-preview" data-store-preview aria-hidden="true"></div>
                <span class="tile-label">Store</span>
            </a>
            <a class="tile feature-tile socials-feature-tile" href="https://social.cocomokio.com/" aria-label="Visit our social pages">
                <div class="tile-image-grid socials-tile-preview" aria-hidden="true">
                    <span class="tile-image-cell"><img src="Images/YouTube logo.svg" alt=""></span>
                    <span class="tile-image-cell"><img src="Images/Twitch logo.svg" alt=""></span>
                    <span class="tile-image-cell"><img src="Images/TikTok logo.svg" alt=""></span>
                </div>
                <span class="tile-label">Socials</span>
            </a>
            <a class="tile" href="pages/server.html">Server</a>
        </section>
        <div data-shared-footer></div>
    </body>
</html>
